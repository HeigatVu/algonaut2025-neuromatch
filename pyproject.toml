[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algonauts-brainstates"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.8",
  "hmmlearn>=0.3.3,<0.4",
  "librosa>=0.10,<1",
  "matplotlib>=3.7,<4",
  "nilearn>=0.9,<1",
  "numpy>=1.26,<3",
  "pandas>=1.5,<3",
  "scikit-learn>=1.2,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
